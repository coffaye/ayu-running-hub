name: Generate Ayu report

run-name: Ayu Report · ${{ inputs.run_id }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Numeric running_page run identity
        required: true
        type: string
      request_id:
        description: Worker request correlation ID
        required: true
        type: string

concurrency:
  group: ayu-report-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate and publish staging report
    runs-on: ubuntu-latest
    env:
      AYU_ENGINE_COMMIT: ${{ github.sha }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT || 'low' }}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${{ vars.DEEPSEEK_MAX_OUTPUT_TOKENS || '16384' }}
      DEEPSEEK_TIMEOUT_SECONDS: ${{ vars.DEEPSEEK_TIMEOUT_SECONDS || '60' }}
    steps:
      - name: Checkout Hub at the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout running_page master as the data source
        uses: actions/checkout@v4
        with:
          repository: coffaye/running_page
          ref: master
          path: running-page-source
          persist-credentials: false

      - name: Checkout running_page staging as the output target
        uses: actions/checkout@v4
        with:
          repository: coffaye/running_page
          ref: ayu-report-e2e
          path: running-page-output
          token: ${{ secrets.RUNNING_PAGE_WRITE_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pinned Hub engine
        run: python -m pip install --disable-pip-version-check -e './engine'

      - name: Build and atomically install the report
        env:
          RUN_ID: ${{ inputs.run_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python scripts/generate_report.py \
            --source-root "$GITHUB_WORKSPACE/running-page-source" \
            --target-root "$GITHUB_WORKSPACE/running-page-output" \
            --run-id "$RUN_ID" \
            --request-id "$REQUEST_ID"

      - name: Verify the output allowlist
        working-directory: running-page-output
        run: |
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            while IFS= read -r path; do
              case "$path" in
                public/reports/manifest.json|public/reports/daily/*) ;;
                *) echo "Unexpected modified path: $path"; exit 1 ;;
              esac
            done <<< "$changed"
          fi

      - name: Commit and push only the staging report files
        working-directory: running-page-output
        env:
          RUN_ID: ${{ inputs.run_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git config user.name "ayu-running-hub[bot]"
          git config user.email "ayu-running-hub[bot]@users.noreply.github.com"
          git add public/reports/manifest.json public/reports/daily
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "No report changes to commit"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              public/reports/manifest.json|public/reports/daily/*) ;;
              *) echo "Unexpected staged path: $path"; exit 1 ;;
            esac
          done <<< "$staged"
          git commit -m "生成 Ayu staging 日报 ${RUN_ID} (${REQUEST_ID})"
          git push origin HEAD:ayu-report-e2e

