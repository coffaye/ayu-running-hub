name: Generate Ayu report

run-name: Ayu Report · ${{ inputs.run_id }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Numeric running_page run identity
        required: true
        type: string
      request_id:
        description: Worker request correlation ID
        required: true
        type: string

concurrency:
  group: ayu-report-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate, publish, and deploy Ayu report
    runs-on: ubuntu-latest
    env:
      AYU_ENGINE_COMMIT: ${{ github.sha }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      RUNNING_PAGE_BRANCH: master
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT || 'low' }}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${{ vars.DEEPSEEK_MAX_OUTPUT_TOKENS || '16384' }}
      DEEPSEEK_TIMEOUT_SECONDS: '90'
      PHASE6_COLLECTOR_URL: ${{ vars.PHASE6_COLLECTOR_URL }}
      PHASE6_COLLECTOR_TIMEOUT_SECONDS: ${{ vars.PHASE6_COLLECTOR_TIMEOUT_SECONDS || '90' }}
      AYU_COLLECTOR_SHARED_SECRET: ${{ secrets.AYU_COLLECTOR_SHARED_SECRET }}
    steps:
      - name: Checkout Hub at the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout running_page master as the identity source
        uses: actions/checkout@v4
        with:
          repository: coffaye/running_page
          ref: master
          path: running-page-source
          persist-credentials: false

      - name: Checkout running_page master as the output target
        uses: actions/checkout@v4
        with:
          repository: coffaye/running_page
          ref: master
          path: running-page-output
          token: ${{ secrets.RUNNING_PAGE_WRITE_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pinned Hub engine
        run: python -m pip install --disable-pip-version-check -e './engine'

      - name: Build and atomically install the COROS-backed report
        env:
          RUN_ID: ${{ inputs.run_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python scripts/generate_report.py \
            --source-root "$GITHUB_WORKSPACE/running-page-source" \
            --target-root "$GITHUB_WORKSPACE/running-page-output" \
            --run-id "$RUN_ID" \
            --request-id "$REQUEST_ID"

      - name: Publish report with conflict-safe manifest merge
        env:
          RUN_ID: ${{ inputs.run_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          publication_json="$(python "$GITHUB_WORKSPACE/scripts/publish_report.py" \
            --target-root "$GITHUB_WORKSPACE/running-page-output" \
            --run-id "$RUN_ID" \
            --request-id "$REQUEST_ID" \
            --artifact-root "$RUNNER_TEMP/ayu-report-publish" \
            --target-branch "$RUNNING_PAGE_BRANCH" \
            --max-attempts 5)"
          echo "$publication_json"
          report_path="$(python -c 'import json,sys; print(json.load(sys.stdin)["reportPath"])' <<< "$publication_json")"
          echo "REPORT_PATH=$report_path" >> "$GITHUB_ENV"

      - name: Dispatch and verify production Pages
        env:
          RUN_ID: ${{ inputs.run_id }}
          RUNNING_PAGE_WRITE_TOKEN: ${{ secrets.RUNNING_PAGE_WRITE_TOKEN }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/deploy_pages.py" \
            --run-id "$RUN_ID" \
            --engine-commit "$AYU_ENGINE_COMMIT" \
            --local-report "$GITHUB_WORKSPACE/running-page-output/$REPORT_PATH" \
            --repository "coffaye/running_page" \
            --workflow "gh-pages.yml" \
            --max-wait-seconds 900
