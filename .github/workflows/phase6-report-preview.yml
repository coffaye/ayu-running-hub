name: Phase 6A report preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "COROS run_id in milliseconds"
        required: true
        default: "1787870493000"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Hub only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install staging engine
        run: python -m pip install -e ./engine

      - name: Install CJK font for Canvas export
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null

      - name: Request authenticated COROS Daily Bundle
        env:
          COLLECTOR_URL: ${{ vars.PHASE6_COLLECTOR_URL }}
          COLLECTOR_SECRET: ${{ secrets.AYU_COLLECTOR_SHARED_SECRET }}
          RUN_ID: ${{ inputs.run_id }}
          REQUEST_ID: phase6-preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          run_id = os.environ["RUN_ID"]
          request_id = os.environ["REQUEST_ID"]
          base = os.environ["COLLECTOR_URL"].rstrip("/")
          path = "/internal/coros/daily-bundle"
          body = json.dumps({"requestId": request_id, "runId": run_id}, separators=(",", ":"))
          timestamp = str(int(time.time()))
          body_hash = hashlib.sha256(body.encode()).hexdigest()
          payload = "\n".join([timestamp, request_id, run_id, "POST", path, body_hash])
          signature = hmac.new(os.environ["COLLECTOR_SECRET"].encode(), payload.encode(), hashlib.sha256).hexdigest()
          request = Request(
              base + path,
              data=body.encode(),
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "ayu-running-phase6-preview",
                  "x-ayu-timestamp": timestamp,
                  "x-ayu-request-id": request_id,
                  "x-ayu-run-id": run_id,
                  "x-ayu-signature": signature,
              },
          )
          try:
              with urlopen(request, timeout=90) as response:
                  status = response.status
                  content = response.read()
          except Exception as exc:
              raise SystemExit(f"Daily Bundle request failed: {type(exc).__name__}") from None
          if status != 200:
              raise SystemExit(f"Daily Bundle request returned HTTP {status}")
          try:
              bundle = json.loads(content)
          except json.JSONDecodeError:
              raise SystemExit("Daily Bundle response was not JSON") from None
          Path("preview").mkdir()
          Path("preview/coros-daily-bundle.json").write_text(json.dumps(bundle, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status": "bundle_saved", "runId": run_id}, ensure_ascii=False))
          PY

      - name: Run three non-publication DeepSeek trials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_TIMEOUT_SECONDS: "20"
          DEEPSEEK_MAX_OUTPUT_TOKENS: "8192"
        run: python engine/scripts/phase6_preview.py --bundle preview/coros-daily-bundle.json --output-dir preview --trials 3

      - name: Export Canvas PNG with a browser runtime
        working-directory: .
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node engine/scripts/export_preview_png.mjs preview/ayu_running_daily_2026-08-28.html preview/ayu_running_daily_2026-08-28.png

      - name: Upload staging review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayu-phase6-preview-${{ inputs.run_id }}
          path: preview/
          if-no-files-found: error
          retention-days: 7
