name: Phase 6 COROS diagnostic

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Running-page timestamp to probe'
        required: true
        default: '1787870493000'
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLLECTOR_URL: ${{ vars.PHASE6_COLLECTOR_URL }}
      AYU_COLLECTOR_SHARED_SECRET: ${{ secrets.AYU_COLLECTOR_SHARED_SECRET }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Probe Phase 6 collector
        shell: python
        run: |
          import hashlib
          import hmac
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          import uuid

          collector_url = os.environ.get("COLLECTOR_URL", "").rstrip("/")
          secret = os.environ.get("AYU_COLLECTOR_SHARED_SECRET", "")
          run_id = os.environ["RUN_ID"]
          if not collector_url.startswith("https://") or not secret:
              print(json.dumps({"status": "CONFIGURATION_ERROR"}))
              sys.exit(2)

          request_id = str(uuid.uuid4())
          timestamp = int(time.time())
          body = json.dumps({"requestId": request_id, "runId": run_id}, separators=(",", ":"))
          body_hash = hashlib.sha256(body.encode()).hexdigest()
          signing_payload = "\n".join([str(timestamp), request_id, run_id, "POST", "/internal/coros/probe", body_hash])
          signature = hmac.new(secret.encode(), signing_payload.encode(), hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              collector_url + "/internal/coros/probe",
              data=body.encode(),
              method="POST",
              headers={
                  "content-type": "application/json",
                  "user-agent": "ayu-running-phase6-diagnostic",
                  "x-ayu-timestamp": str(timestamp),
                  "x-ayu-request-id": request_id,
                  "x-ayu-run-id": run_id,
                  "x-ayu-signature": signature,
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  status = response.status
                  payload = json.loads(response.read(65536).decode())
          except urllib.error.HTTPError as error:
              status = error.code
              payload = {}
          except Exception:
              print(json.dumps({"status": "NETWORK_ERROR"}))
              sys.exit(1)

          allowed = {
              "runDate": payload.get("runDate"),
              "tomorrowDate": payload.get("tomorrowDate"),
              "credentialGeneration": payload.get("credentialGeneration"),
              "toolCount": payload.get("toolCount"),
              "categories": payload.get("categories"),
              "error": payload.get("error"),
          }
          print(json.dumps({"httpStatus": status, **{key: value for key, value in allowed.items() if value is not None}}, separators=(",", ":")))
          if status < 200 or status >= 300:
              sys.exit(1)
